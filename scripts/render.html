<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>html,body{margin:0;background:transparent}</style></head>
<body><script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
import { buildCar } from "/scripts/car-builder.js";

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

window.renderCar = ({ type, color, view, w, h, bg }) => {
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(1);
  const scene = new THREE.Scene();
  scene.environment = env;
  if (bg) scene.background = new THREE.Color(bg);
  const car = buildCar(type, color);
  scene.add(car);
  const box = new THREE.Box3().setFromObject(car);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const key = new THREE.DirectionalLight(0xffffff, 2.2);
  key.position.set(3, 8, 4); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 });
  key.shadow.radius = 8; key.shadow.blurSamples = 20;
  scene.add(key);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: bg ? 0.45 : 0.28 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
  scene.add(ground);
  const cam = new THREE.PerspectiveCamera(24, w / h, 0.1, 100);
  const views = {
    front34: [1, 0.32, 1.05], side: [0, 0.12, 1], rear34: [-1, 0.36, 1.0], hero: [1.1, 0.12, 0.9],
  };
  const v = new THREE.Vector3(...views[view]).normalize();
  const radius = Math.max(size.x, size.y * 1.6) * (view === "side" ? 2.3 : 2.0) * (w / h < 1.4 ? 1.25 : 1);
  cam.position.copy(center).addScaledVector(v, radius);
  cam.lookAt(center.x, center.y * 0.85, center.z);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL("image/png");
};

window.exportGLB = ({ type, color }) => new Promise((resolve, reject) => {
  const car = buildCar(type, color);
  new GLTFExporter().parse(car, async (buf) => {
    const bytes = new Uint8Array(buf);
    let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    resolve(btoa(s));
  }, reject, { binary: true });
});
window.ready = true;
</script></body></html>
